name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  spec:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The gemspec claims >= 3.1, so the oldest and newest supported releases
        # both need to be proven.
        ruby: ["3.1", "3.2", "3.3", "3.4", "4.0"]
    name: Ruby ${{ matrix.ruby }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec

  mutant:
    runs-on: ubuntu-latest
    name: Mutation coverage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          # Pinned rather than matrixed: mutant parses source through the `parser`
          # gem, which trails new Ruby releases.
          ruby-version: "3.4"
          bundler-cache: true

      # Exits non-zero on the first surviving mutation. Capistrano::Mise::Commands
      # is at 100%.
      - run: bundle exec mutant run
