name: Release

# Triggered by pushing a version tag:
#   bump lib/capistrano/mise/version.rb, commit, then
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # OIDC, for RubyGems trusted publishing
      packages: write # GitHub Packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: ruby
          bundler-cache: true

      # Runs `bundle exec rake release`: builds into pkg/, then pushes to
      # rubygems.org over OIDC. The tag already exists at this point, so
      # bundler's tag step is a no-op.
      - uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1

      # Optional target. RubyGems has already published by this point and that
      # cannot be undone, so a failure here must not fail the release.
      # GitHub Packages wants the token as a Bearer credential under its own key,
      # which GEM_HOST_API_KEY alone does not produce.
      - name: Push to GitHub Packages
        continue-on-error: true
        env:
          GEM_HOST_API_KEY: "Bearer ${{ secrets.GITHUB_TOKEN }}"
          OWNER: ${{ github.repository_owner }}
        run: |
          mkdir -p "$HOME/.gem"
          touch "$HOME/.gem/credentials"
          chmod 0600 "$HOME/.gem/credentials"
          printf -- "---\n:github: ${GEM_HOST_API_KEY}\n" > "$HOME/.gem/credentials"
          gem push --KEY github --host "https://rubygems.pkg.github.com/${OWNER}" pkg/*.gem

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" pkg/*.gem --generate-notes
